workflows:
  waqt-release:
    name: وقت الحلاقة - نسخة النشر (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: fakkha
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.waqtalhelaqa.app
      vars:
        APP_VERSION: "1.0"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: تثبيت
        script: npm install
      - name: ملفات التطبيق
        script: |
          mkdir -p www
          cp index.html logo.jpg privacy.html www/
      - name: إضافة iOS
        script: npx cap add ios
      - name: تجهيز iOS (Firebase، الإشعارات، الأيقونة)
        script: |
          cp GoogleService-Info.plist ios/App/App/
          python3 scripts/patch_ios.py
          ruby scripts/ios_setup.rb
      - name: مزامنة
        script: npx cap sync ios
      - name: التوقيع
        script: xcode-project use-profiles
      - name: البناء
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
