<style>
:root{--bg:#F6F4F1;--card:#fff;--ink:#22232A;--muted:#8B8A90;--line:#ECE8E2;
--pri:#24252D;--acc:#B9744A;--accSoft:#F6EAE1;--ok:#3C8D6E;--okSoft:#E3F2EC;--bad:#C9553F;--badSoft:#FBE8E3;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:0}
input,select,textarea{font-family:inherit;font-size:16px}
.demo{background:#2E2F38;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 10px;position:sticky;top:0;z-index:30;min-height:12px}
.demo small{display:block;text-align:center;opacity:.8;font-size:12px}
.hdr{padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:flex-end}
.hdr h1{margin:0;font-size:22px;font-weight:800}
.hdr .sub{color:var(--muted);font-size:13px}
.back{background:none;color:var(--acc);font-size:15px;padding:0;margin-bottom:4px}
.wrap{padding:10px 18px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.ttl{font-weight:700;font-size:16px;margin:6px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.ttl span{font-size:13px;color:var(--muted);font-weight:500}
.hoods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hood{color:inherit;font-family:inherit;background:#fff;border-radius:18px;padding:18px 14px;text-align:right;box-shadow:0 1px 0 var(--line)}
.hood b{display:block;font-size:17px}
.hood span{font-size:13px;color:var(--muted)}
.hood .e{font-size:24px;display:block;margin-bottom:6px}
.br{background:#fff;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px;box-shadow:0 1px 0 var(--line);cursor:pointer}
.av{width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,#3A3B45,#22232A);color:#fff;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.br .mid{flex:1;min-width:0}
.br .mid b{display:block;font-size:16px}
.br .mid span{font-size:13px;color:var(--muted)}
.feat{background:var(--accSoft);color:var(--acc);font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;margin-right:6px}
.shop{background:linear-gradient(155deg,#33343D,#1F2026);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}
.shop h2{margin:0 0 4px;font-size:22px}
.shop span{opacity:.75;font-size:14px}
.svc{display:flex;align-items:center;justify-content:space-between;padding:13px;border-radius:14px;background:var(--bg);margin-bottom:8px;border:2px solid transparent;cursor:pointer}
.svc.on{border-color:var(--acc);background:var(--accSoft)}
.svc b{font-size:15px}.svc span{font-size:12px;color:var(--muted);display:block}
.svc .pr{font-weight:800}
.svc.na{background:#EFEDE9;cursor:default;opacity:.75}
.svc.na b{color:#A9A59E}
.svc.na .av{background:#CFCBC4!important}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.day{min-width:62px;text-align:center;background:#fff;border-radius:14px;padding:10px 4px;border:2px solid transparent;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.day b{display:block;font-size:18px}.day span{font-size:12px;color:var(--muted)}
.day.on{border-color:var(--acc);background:var(--accSoft)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:#fff;border-radius:12px;padding:11px 0;text-align:center;font-size:14px;font-weight:700;border:2px solid transparent;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.slot.on{border-color:var(--acc);background:var(--accSoft);color:var(--acc)}
.slot.off{background:#EFEDE9;color:#BDB9B2;text-decoration:line-through;cursor:default;box-shadow:none}
.slot.blk{background:var(--badSoft);color:var(--bad)}
.slot.bkd{background:var(--okSoft);color:var(--ok);cursor:default}
.btn{background:var(--pri);color:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:700;width:100%}
.btn.acc{background:var(--acc)}
.btn.sec{background:var(--accSoft);color:var(--acc)}
.btn.sm{width:auto;padding:8px 13px;font-size:13px;border-radius:11px}
.btn.okb{background:var(--okSoft);color:var(--ok)}
.btn.badb{background:var(--badSoft);color:var(--bad)}
.btn:disabled{opacity:.4}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#FBFAF8;outline:none}
.two{display:flex;gap:8px}.two>*{flex:1}
.done{text-align:center;padding:30px 10px}
.done .e{width:86px;height:86px;border-radius:50%;background:var(--okSoft);color:var(--ok);font-size:44px;display:grid;place-items:center;margin:10px auto 14px}
.done h2{margin:0 0 6px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.kv:last-child{border:0}.kv span{color:var(--muted)}
.dl{position:sticky;bottom:12px;margin:16px 18px 0;background:var(--pri);color:#fff;border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.dl .e{font-size:28px}.dl div{flex:1;font-size:14px}.dl b{display:block;font-size:15px}
.bk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bk:last-child{border:0}
.bk .tm{background:var(--accSoft);color:var(--acc);font-weight:800;border-radius:12px;padding:10px 8px;min-width:62px;text-align:center}
.bk .mid{flex:1;min-width:0}.bk .mid b{display:block}.bk .mid span{font-size:13px;color:var(--muted)}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:10px}
.st.done{background:var(--okSoft);color:var(--ok)}.st.cancel{background:var(--badSoft);color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stats div{background:#fff;border-radius:16px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:#EAE6E0;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:none;border-radius:11px;padding:9px 2px;font-size:14px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:700}
.link{background:var(--bg);border-radius:12px;padding:12px;text-align:center;font-weight:700;direction:ltr;word-break:break-all}
#qr{display:flex;justify-content:center;margin:16px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:12px}
.adm{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.adm:last-child{border:0}.adm .mid{flex:1;min-width:0}.adm .mid b{display:block}.adm .mid span{font-size:12px;color:var(--muted)}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;padding:5px 10px;border-radius:10px;background:var(--bg);cursor:pointer}
.pill.on{background:var(--okSoft);color:var(--ok);font-weight:700}
.pill.offp{background:var(--badSoft);color:var(--bad);font-weight:700}
.pill.ft{background:var(--accSoft);color:var(--acc);font-weight:700}
.spill{background:#fff;border:1.5px solid #E8DACD;color:var(--ink);border-radius:14px;box-shadow:0 1px 3px rgba(185,116,74,.08)}
.spill.ft{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
.empty{color:var(--muted);text-align:center;padding:16px 0;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(20,20,25,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 14px;text-align:center}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.box{display:flex;align-items:center;gap:14px;width:100%;background:#fff;color:inherit;border-radius:22px;padding:20px 18px;margin-bottom:12px;text-align:right;box-shadow:0 1px 0 var(--line)}
.box .e{width:58px;height:58px;border-radius:18px;background:var(--accSoft);display:grid;place-items:center;font-size:28px;flex-shrink:0}
.box b{display:block;font-size:18px;margin-bottom:3px}
.box span{font-size:13px;color:var(--muted)}
.box.main{background:linear-gradient(155deg,#33343D,#1F2026);color:#fff}
.box.main .e{background:rgba(255,255,255,.12)}
.box.main span{color:rgba(255,255,255,.7)}
.box .cnt{margin-right:auto;background:var(--acc);color:#fff;font-weight:800;border-radius:12px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding:0 8px}
.mb{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.mb .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mb .top b{font-size:17px}
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#33343D,#16171B 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sl{width:130px;height:130px;border-radius:38px;box-shadow:0 0 0 0 rgba(185,116,74,.5),0 18px 40px rgba(0,0,0,.45);animation:spIn 1s cubic-bezier(.2,1.4,.4,1) both,spPulse 2s 1s ease-out infinite}
#splash .sn{margin-top:26px;font-size:34px;font-weight:800;color:#D9925F;letter-spacing:.5px;animation:spUp .8s .7s ease both}
@keyframes spIn{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spPulse{0%{box-shadow:0 0 0 0 rgba(185,116,74,.55),0 18px 40px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 28px rgba(185,116,74,0),0 18px 40px rgba(0,0,0,.45)}}
@keyframes spUp{0%{transform:translateY(18px);opacity:0}100%{transform:none;opacity:1}}
.login{padding:40px 22px;text-align:center}
.login .logo{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:40px;margin:10px auto 18px;box-shadow:0 10px 24px rgba(0,0,0,.2);background:linear-gradient(155deg,#33343D,#1F2026)}
.login .appname{font-size:28px;font-weight:800;color:#B9744A;margin:-6px 0 22px;letter-spacing:.5px}
.login h1{margin:0 0 6px;font-size:24px}
.login p{color:var(--muted);margin:0 0 24px}
.login .card{text-align:right}
.ph{display:flex;gap:8px;direction:ltr}
.ph span{background:var(--bg);border-radius:12px;padding:12px;font-weight:700;color:var(--muted)}
.ph input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#FBFAF8;outline:none;font-size:18px;letter-spacing:1px;min-width:0}
.iap{background:#F2F2F7;border-radius:22px 22px 0 0;margin:-18px -18px -28px;padding:16px 18px 30px;font-family:-apple-system,system-ui,'Tajawal',sans-serif}
.iap .row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
.iap .ic{width:56px;height:56px;border-radius:14px;flex-shrink:0}
.spin{width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:24px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.stars{display:flex;justify-content:center;gap:8px;font-size:46px;margin:6px 0}
.stars span{color:#DDD8D0;cursor:pointer;transition:.15s}
.stars span.on{color:#E8A93B}
.rt{font-size:13px;font-weight:700;color:#C98A1E;background:#FBF1DE;padding:3px 8px;border-radius:10px;margin-right:6px;white-space:nowrap;display:inline-block}
.rt small{font-weight:500;color:var(--muted)}
.rt.none{color:var(--muted);background:var(--bg);font-weight:500}
.box .kv span{font-size:14px}.box .kv b{display:inline;font-size:15px;margin:0}
.cal{display:flex!important;flex-direction:column;overflow:hidden;background:#fff!important;border:1.5px solid #E8DACD}
.cal i{font-style:normal;background:var(--acc);color:#fff;font-size:11px;font-weight:700;width:100%;text-align:center;padding:3px 0}
.cal em{font-style:normal;flex:1;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--ink);line-height:1}
.lgbg{background:#25282F url(logo.jpg) center/cover no-repeat!important;overflow:hidden}
.svbtn{background:var(--acc);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.svl{font-size:13px;color:var(--acc);margin-top:3px;font-weight:500}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #D8D2CA;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;flex-shrink:0}
.svc.on .chk{background:var(--acc);border-color:var(--acc)}
.nt{position:fixed;top:-180px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:460px;background:rgba(250,250,252,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:80;transition:top .45s cubic-bezier(.2,1.2,.4,1)}
.nt.show{top:calc(10px + env(safe-area-inset-top))}
.nt .ic{width:42px;height:42px;border-radius:11px;flex-shrink:0}
.nt .tx{flex:1;min-width:0}
.nt .hd{display:flex;justify-content:space-between;font-size:12px;color:#8E8E93;margin-bottom:2px}
.nt b{display:block;font-size:15px;color:#1C1C1E}
.nt .m{font-size:14px;color:#3A3A3C;display:block}
.nt .skip{background:#E5E5EA;color:#1C1C1E;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:700;flex-shrink:0;align-self:center}
.load{text-align:center;padding:80px 20px;color:var(--muted)}
</style>
</head>

async function doLogin(){const p=normPh(document.getElementById('l_p').value);if(!okPh(p)){toast('اكتب رقم جوال صحيح');return}
 const w=document.getElementById('l_w').value;if(w.length<4){toast('كلمة السر ٤ خانات على الأقل');return}
 L.phone=p;L.pw=w;busy('جاري الدخول…');
 try{const s=await db.collection('phones').doc(p).get();
  if(!s.exists){closeSheet();L.step='name';render();return}
  await auth.signInWithEmailAndPassword(EM(p),PW(w));closeSheet();
 }catch(e){closeSheet();toast(e.code&&e.code.includes('too-many')?'محاولات كثيرة، جرّب بعد شوي':'كلمة السر غلط')}}

 busy('جاري فتح حسابك…');
 try{const c=await auth.createUserWithEmailAndPassword(EM(L.phone),PW(L.pw));const uid=c.user.uid;
  await db.collection('phones').doc(L.phone).set({uid,t:'c'});
  await db.collection('users').doc(uid).set({role:'c',phone:L.phone,name:n,pinH:await sha(L.phone+':'+pin),fcm:[],nB:0,nC:0,at:Date.now()});

function myPast(){return C.myB.filter(k=>k.status!=='new'||k.date<todayK()).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))}
const toRate=()=>C.myB.filter(k=>k.status==='done'&&!k.rate);
let SLOTW={};
function watchSlots(bid,date){const key=bid+'|'+date;if(SLOTW.k===key)return;if(SLOTW.u)SLOTW.u();C.slots=new Set();SLOTW={k:key};
 if(!UID)return;SLOTW.u=db.collection('slots').where('shop','==',bid).where('date','==',date).onSnapshot(s=>{C.slots=new Set(s.docs.map(d=>d.data().time));render()},()=>{})}
function slotsFor(b,date){const out=[];let[h,m]=b.from.split(':').map(Number);const[eh,em]=b.to.split(':').map(Number);const end=eh*60+em;
 const now=new Date();const isToday=date===dkey(now);const nowMin=now.getHours()*60+now.getMinutes();
 for(let t=h*60+m;t<end;t+=30){const s=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
  out.push({s,booked:C.slots.has(s),blk:(b.blocked||[]).includes(date+'|'+s),past:isToday&&t<=nowMin})}
 return out}

let BSL={};
function slotsForB(b,date){const key=b.id+'|'+date;if(BSL.k!==key){BSL={k:key,set:new Set()};}
 const set=new Set(C.shopB.filter(x=>x.date===date&&x.status==='new').map(x=>x.time));
 const out=[];let[h,m]=b.from.split(':').map(Number);const[eh,em]=b.to.split(':').map(Number);const end=eh*60+em;
 for(let t=h*60+m;t<end;t+=30){const s=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;out.push({s,booked:set.has(s),blk:(b.blocked||[]).includes(date+'|'+s)})}return out}
function updShop(o){db.collection('shops').doc(ME.shopId).update(o).catch(()=>toast('ما انحفظ، جرّب مرة ثانية'))}
function togStaff(i){const b=B(ME.shopId);const st=(b.staff||[]).map(x=>Object.assign({},x));st[i].av=!st[i].av;updShop({staff:st});toast(st[i].n+(st[i].av?' صار متاح ✓':' صار غير متاح'))}
function toggleBlk(date,s){const k=date+'|'+s;const b=B(ME.shopId);updShop({blocked:(b.blocked||[]).includes(k)?FV.arrayRemove(k):FV.arrayUnion(k)})}
async function setSt(id,s){const k=C.shopB.find(x=>x.id===id);if(!k)return;
 try{await db.collection('bookings').doc(id).update({status:s});if(s==='cancel')db.collection('slots').doc(slotId(k)).delete().catch(()=>{});api('/event',{type:s==='done'?'sdone':'scancel',id})}catch(e){toast('ما انحفظ، جرّب مرة ثانية')}}
function subCard(b){const n=subDays(b),d=dOf(b.sub);
 return `<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b>اشتراكك</b><div style="font-size:13px;color:${n<=7?'var(--bad)':'var(--muted)'}">${n<0?'منتهي':`ساري لين ${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()} (باقي ${n} يوم)`}</div></div><button class="btn sm acc" onclick="reqSheet()">جدّد</button></div>`}
function priceCard(b){if(b.pLock)return `<div class="card"><div class="ttl">الخدمات والأسعار <span>🔒 معتمدة</span></div>${b.svcs.map(s=>`<div class="kv"><span>${esc(s.n)}</span><b>${s.price} ريال</b></div>`).join('')}<div class="note" style="margin:10px 0">إذا تغيّرت قائمة أسعار المحل أو عندك خدمة إضافية، راسل الإدارة وأرفق صورة قائمة الأسعار عشان نراجعها ونعدّلها</div><button class="btn sec" onclick="nav({p:'msg'})">💬 راسل الإدارة</button></div>`;
 return `<div class="card" style="border:2px solid var(--acc)"><div class="ttl">الخدمات والأسعار</div><div class="note" style="margin:-4px 0 12px">حط الأسعار نفس قائمة أسعار محلك. تنحط مرة وحدة، وبعد الاعتماد ما تتغير إلا عن طريق الإدارة</div>${b.svcs.map((s,i)=>`<div class="two" style="align-items:center;margin-bottom:8px"><b style="flex:1.4">${esc(s.n)}</b><input id="pr_${i}" style="padding:9px;border-radius:10px;border:1px solid var(--line);min-width:0" type="number" inputmode="numeric" value="${s.price||''}"><span style="flex:.4;color:var(--muted);font-size:13px">ريال</span></div>`).join('')}<button class="btn acc" onclick="lockPrices()">اعتماد الأسعار</button></div>`}
function lockPrices(){const b=B(ME.shopId);const P=b.svcs.map((s,i)=>+document.getElementById('pr_'+i).value);if(P.some(p=>!(p>0))){toast('اكتب سعر كل خدمة');return}
 sheet(`<h3>تعتمد الأسعار؟</h3>${b.svcs.map((s,i)=>`<div class="kv"><span>${esc(s.n)}</span><b>${P[i]} ريال</b></div>`).join('')}<div class="note" style="text-align:center;margin:12px 0">بعد الاعتماد ما تقدر تغيرها، وأي تغيير يكون عن طريق الإدارة</div><button class="btn acc" onclick="doLock([${P}])">نعم اعتمدها</button><div style="height:8px"></div><button class="btn sec" onclick="closeSheet()">رجوع</button>`)}
function doLock(P){const b=B(ME.shopId);updShop({svcs:b.svcs.map((s,i)=>Object.assign({},s,{price:P[i]})),pLock:true});closeSheet();toast('انعتمدت الأسعار ✓')}
let MIMG=null;
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);MIMG=c.toDataURL('image/jpeg',.6);document.getElementById('m_prev').innerHTML=`<div style="position:relative;margin-top:8px"><img src="${MIMG}" style="width:100%;border-radius:12px;display:block"><button class="btn sm badb" style="position:absolute;top:8px;left:8px" onclick="MIMG=null;document.getElementById('m_prev').innerHTML=''">✕</button></div>`};im.src=r.result};r.readAsDataURL(f)}
const imgTag=m=>m.img?`<img src="${m.img}" onclick="viewImg('${m.id}')" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px;cursor:pointer;display:block">`:'';
function viewImg(id){const m=C.msgs.find(x=>x.id===id);if(!m||!m.img)return;sheet(`<h3>الصورة المرفقة</h3><img src="${m.img}" style="width:100%;border-radius:12px"><div style="height:12px"></div><button class="btn acc" onclick="closeSheet()">إغلاق</button>`)}
async function sendMsg(){const f=document.getElementById('m_f').value.trim(),t=document.getElementById('m_t').value.trim();if(!f||(!t&&!MIMG)){toast('اكتب اسمك ورسالتك');return}
 try{await db.collection('msgs').add({shopId:ME.shopId,from:f,text:t,img:MIMG||null,at:Date.now(),read:false,replies:[],rNew:false});MIMG=null;render();toast('انرسلت رسالتك للإدارة ✓')}catch(e){toast('ما انرسلت — الصورة كبيرة؟ جرّب مرة ثانية')}}
function bcCards(){const Lx=C.bcast;return Lx.length?`<div class="ttl">📢 من الإدارة</div><div class="card" style="border:2px solid var(--acc)">${Lx.map(m=>`<div class="bk"><div class="mid"><span style="color:var(--ink);white-space:pre-wrap;font-size:15px;display:block">${esc(m.text)}</span><span>${when(m.at)}</span></div></div>`).join('')}</div>`:''}
function dlQR(){const b=B(ME.shopId);const tmp=document.createElement('div');let q;
 try{new QRCode(tmp,{text:SITE+'/'+b.id,width:440,height:440,colorDark:'#22232A',correctLevel:QRCode.CorrectLevel.H});q=tmp.querySelector('canvas')}catch(e){}
 if(!q){toast('الباركود ما جهز، جرّب مرة ثانية');return}
 const c=document.createElement('canvas');c.width=600;c.height=800;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,600,800);x.fillStyle='#22232A';x.fillRect(0,0,600,14);
 x.textAlign='center';x.direction='rtl';x.fillStyle='#22232A';x.font='800 42px Tajawal, sans-serif';x.fillText(b.name,300,90);
 x.fillStyle='#8B8A90';x.font='500 26px Tajawal, sans-serif';x.fillText('امسح الكود واحجز موعدك ✂️',300,135);
 x.drawImage(q,80,170,440,440);
 x.direction='ltr';x.fillStyle='#B9744A';x.font='700 26px Tajawal, sans-serif';x.fillText(SITE.replace('https://','')+'/'+b.id,300,670);
 x.direction='rtl';x.fillStyle='#8B8A90';x.font='500 22px Tajawal, sans-serif';x.fillText(b.hood+' · '+b.loc,300,715);
 sheet(`<h3>باركود ${esc(b.name)}</h3><img src="${c.toDataURL('image/png')}" style="width:100%;border-radius:14px;border:1px solid var(--line)"><div style="text-align:center;margin:14px 0 4px;font-weight:700;color:var(--acc)">👆 اضغط على الصورة مطوّل واختار «حفظ الصورة»</div>`)}
function drawQR(){const el=document.getElementById('qr');if(!el||el.childNodes.length)return;try{new QRCode(el,{text:SITE+'/'+ME.shopId,width:170,height:170,colorDark:'#22232A'})}catch(e){el.innerHTML='<div class="empty">▦ كود QR</div>'}}

let STORE=null,PAYING=null;

 store.register(PLANS.map(p=>({id:p.id,type:ProductType.NON_RENEWING_SUBSCRIPTION,platform:Platform.APPLE_APPSTORE})));
 store.when().approved(async tx=>{const pid=(tx.products&&tx.products[0]&&tx.products[0].id)||'';const r=await api('/iap',{tx:tx.transactionId,product:pid,shopId:ME&&ME.shopId});
  if(r.ok||r.error==='used'){tx.finish();if(r.ok){const d=dOf(r.sub);sheet(`<div class="done" style="padding:10px 0"><div class="e">✓</div><h2>تم الشراء</h2><div style="font-weight:700;color:var(--ok)">اشتراكك ساري لين ${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}</div><div class="note" style="margin-top:8px">ما راح ينخصم منك شي تلقائي</div></div><button class="btn acc" onclick="closeSheet()">تمام</button>`)}}
  else{closeSheet();toast('ما تأكد الدفع، تواصل مع الإدارة')}PAYING=null});

 await db.collection('shops').doc(id).update({svcs:sv,pLock:true});closeSheet();toast('انحفظت الأسعار ✓')}
function addBarber(){sheet(`<h3>إضافة محل</h3>
 <div class="fld"><label>اسم المحل</label><input id="a_n" placeholder="مثلاً: صالون النخبة"></div>
 <div class="fld"><label>الحي</label><select id="a_h" onchange="document.getElementById('a_nh').style.display=this.value==='__new'?'block':'none'">${hoodOpts()}<option value="__new">+ حي جديد</option></select></div>
 <div id="a_nh" style="display:none"><div class="two"><div class="fld"><label>اسم الحي الجديد</label><input id="a_hn"></div><div class="fld"><label>الجهة</label><select id="a_hr">${REG.map(r=>`<option value="${r.k}">${r.n}</option>`).join('')}</select></div></div></div>
 <div class="fld"><label>اسم الشارع</label><input id="a_l" placeholder="الشارع أو علامة قريبة"></div>
 <div class="fld"><label>أسماء الحلاقين</label><input id="a_st" placeholder="مثلاً: ماجد، سلطان"></div>
 <div class="fld"><label>جوال صاحب المحل</label><input id="a_p" type="tel" inputmode="tel" placeholder="05xxxxxxxx"></div>
 <div class="fld"><label>كلمة السر لصاحب المحل</label><input id="a_w" placeholder="٤ خانات على الأقل"></div>
 <div class="note" style="margin-bottom:12px">ياخذ شهر مجاني، ويحط أسعاره أول مرة من شاشته</div>
 <button class="btn acc" onclick="saveBarber()">إضافة واعتماد</button>`)}
async function saveBarber(){const n=document.getElementById('a_n').value.trim();let h=document.getElementById('a_h').value;
 if(h==='__new'){h=document.getElementById('a_hn').value.trim();if(h&&!REGOF[h])await db.collection('config').doc('hoods').set({x:{[h]:document.getElementById('a_hr').value}},{merge:true})}
 const l=document.getElementById('a_l').value.trim(),p=normPh(document.getElementById('a_p').value),w=document.getElementById('a_w').value.trim();
 const st=document.getElementById('a_st').value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);
 if(!n||!h||!l){toast('كمّل البيانات');return}if(!okPh(p)){toast('اكتب رقم جوال صحيح');return}if(w.length<4){toast('كلمة السر ٤ خانات على الأقل');return}
 busy();
 try{const ex=await db.collection('phones').doc(p).get();if(ex.exists){closeSheet();toast('هالرقم مسجّل من قبل');return}
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB,'sec');const c=await sec.auth().createUserWithEmailAndPassword(EM(p),PW(w));const uid=c.user.uid;await sec.auth().signOut();
  const ref=db.collection('shops').doc();const bt=db.batch();
  bt.set(ref,{name:n,hood:h,loc:l,phone:p,ownerUid:uid,active:true,sub:dkey(addDays(30)),svcs:SV6().map(s=>Object.assign(s,{price:0})),pLock:false,staff:st.map(x=>({n:x,av:true})),from:'16:00',to:'23:00',blocked:[],rS:0,rN:0,sr:{},at:Date.now()});
  bt.set(db.collection('users').doc(uid),{role:'b',phone:p,name:n,shopId:ref.id,fcm:[],at:Date.now()});bt.set(db.collection('phones').doc(p),{uid,t:'b'});
  await bt.commit();closeSheet();toast('تمت الإضافة ✓')}catch(e){closeSheet();toast('صار خطأ');console.log(e)}}
function adPays(){const P=C.pays;const M=paysMonth(),tot=M.reduce((a,p)=>a+(p.amt||0),0);
 return backA('المدفوعات')+`<div class="wrap"><div class="card"><div class="ttl">هالشهر</div><div class="kv"><span>المدفوع من المحلات</span><b>${fmt(tot)} ريال</b></div><div class="kv"><span>نسبة أبل (١٥٪)</span><b style="color:var(--bad)">- ${fmt(tot*APPLE)} ريال</b></div><div class="kv"><span>الصافي لك</span><b style="color:var(--ok);font-size:18px">${fmt(tot*(1-APPLE))} ريال</b></div><div class="note">المحلات اللي في شهرها المجاني أو اللي مددت لها مجاناً ما تنحسب</div></div>
 <div class="ttl">السجل</div><div class="card">${P.length?P.map(p=>{const b=B(p.shopId);const d=new Date(p.at);return `<div class="bk"><div class="tm">${d.getDate()}<div style="font-size:11px;font-weight:500">${MN[d.getMonth()]}</div></div><div class="mid"><b>${esc(b?b.name:'محل محذوف')}</b><span>${planName(p.m)} · ${p.src==='apple'?'دفع عن طريق أبل':'تمديد مجاني منك'}</span></div><b style="color:${p.src==='apple'?'var(--ok)':'var(--muted)'}">${p.src==='apple'?fmt(p.amt)+' ريال':'مجاني'}</b></div>`}).join(''):'<div class="empty">ما فيه مدفوعات للحين</div>'}</div></div>`}
function adReports(){const now=new Date();const mb=C.monthB.filter(k=>k.status!=='cancel');
 const R=Object.values(C.shops).map(b=>({b,n:mb.filter(k=>k.shopId===b.id).length})).sort((a,c)=>c.n-a.n);
 return backA('التقارير')+`<div class="wrap"><div class="stats"><div><b>${C.custs.length}</b><span>زبون مسجّل</span></div><div><b>${mb.length}</b><span>حجز هالشهر</span></div><div><b>${mb.filter(k=>k.date===todayK()).length}</b><span>حجز اليوم</span></div></div>
 <div class="ttl">المحلات حسب النشاط <span>حجوزات ${MN[now.getMonth()]}</span></div><div class="card">${R.length?R.map((x,i)=>`<div class="bk"><div class="tm" style="${x.n?'':'background:var(--badSoft);color:var(--bad)'}">${i+1}</div><div class="mid"><b>${esc(x.b.name)}</b><span>📍 ${esc(x.b.hood)}${x.n?'':' · ما استخدم التطبيق هالشهر'}</span></div><b>${x.n} حجز</b></div>`).join(''):'<div class="empty">ما فيه محلات للحين</div>'}</div></div>`}
function adCusts(){const U=C.custs.slice().sort((a,c)=>(c.nC||0)-(a.nC||0));
 return backA('الزباين')+`<div class="wrap"><div class="note" style="margin:0 2px 10px">مرتبين حسب الأكثر إلغاء. إذا زبون يحجز ولا يجي، احظره وما يقدر يدخل التطبيق</div><div class="card">${U.length?U.map(x=>`<div class="adm"><div class="mid"><b>${esc(x.name)}${x.blocked?' <span class="st cancel">محظور</span>':''}</b><a href="tel:${esc(x.phone)}" style="direction:ltr;display:inline-block;font-size:12px;color:var(--muted)">📞 ${esc(x.phone)}</a><span style="display:block">${x.nB||0} حجز · <span style="color:${x.nC?'var(--bad)':'var(--muted)'}">${x.nC||0} ملغي</span></span></div><button class="btn sm ${x.blocked?'okb':'badb'}" onclick="togBlock('${x.id}')">${x.blocked?'فك الحظر':'🚫 حظر'}</button></div>`).join(''):'<div class="empty">ما فيه زباين مسجلين</div>'}</div></div>`}
function togBlock(uid){const u=C.custs.find(x=>x.id===uid);if(!u)return;if(u.blocked){db.collection('users').doc(uid).update({blocked:false});toast('انفك الحظر ✓');return}
 sheet(`<h3>تحظر ${esc(u.name)}؟</h3><div style="text-align:center;color:var(--muted);margin-bottom:14px">ما يقدر يدخل التطبيق ولا يحجز لين تفك الحظر</div><button class="btn badb" onclick="db.collection('users').doc('${uid}').update({blocked:true});closeSheet();toast('انحظر')">نعم احظره</button>`)}
function bcSheet(){sheet(`<h3>📢 رسالة لكل المحلات</h3><div class="note" style="text-align:center;margin:-6px 0 12px">توصل لكل المحلات (${Object.keys(C.shops).length}) كإشعار وتطلع لهم في «تواصل»</div><textarea id="bc_t" rows="5" placeholder="مثلاً: نزل تحديث جديد…" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#FBFAF8;outline:none;font-size:16px"></textarea><div style="height:10px"></div><button class="btn acc" onclick="sendBc()">أرسل للكل</button>`)}
async function sendBc(){const t=document.getElementById('bc_t').value.trim();if(!t){toast('اكتب الرسالة');return}const r=await db.collection('bcast').add({text:t,at:Date.now()});api('/event',{type:'bcast',id:r.id});closeSheet();toast('انرسلت لكل المحلات ✓')}
</script>
